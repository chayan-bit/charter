[package]
name = "charter-program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
charter-crypto = { path = "../charter-crypto" }
bs58 = "0.5"
gix-glob = "0.29"
hex = { version = "0.4", features = ["serde"] }
minicbor = { version = "2", features = ["alloc"] }
# no_module: no `import`, no module resolver, no file access.
rhai = { version = "1.27", default-features = false, features = ["std", "no_float", "only_i64", "no_time", "no_custom_syntax", "no_module", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
