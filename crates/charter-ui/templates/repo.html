<section class="repo">
<h1><a href="/r/{{ r.hex }}">{{ r.name }}</a></h1>
{% if !r.description.is_empty() %}<p class="desc">{{ r.description }}</p>{% endif %}
{% include "verify.html" %}
<nav class="tabs" aria-label="Repository">
<a href="/r/{{ r.hex }}" data-go="c"{% if r.tab == "code" %} aria-current="page"{% endif %}>Code</a>
<a href="/r/{{ r.hex }}/log/{{ r.default_ref }}" data-go="l"{% if r.tab == "log" %} aria-current="page"{% endif %}>Commits</a>
<a href="/r/{{ r.hex }}/issues" data-go="i"{% if r.tab == "issues" %} aria-current="page"{% endif %}>Issues <span class="n">{{ r.issues }}</span></a>
<a href="/r/{{ r.hex }}/patches" data-go="p"{% if r.tab == "patches" %} aria-current="page"{% endif %}>Patches <span class="n">{{ r.patches }}</span></a>
<a href="/r/{{ r.hex }}/releases" data-go="r"{% if r.tab == "releases" %} aria-current="page"{% endif %}>Releases</a>
<a href="/r/{{ r.hex }}/program"{% if r.tab == "program" %} aria-current="page"{% endif %}>Program</a>
<a href="#verify" data-go="v">Verification</a>
</nav>
</section>
