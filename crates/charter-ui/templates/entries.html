<table class="list tree" data-list>
<tbody>
{% for e in entries %}
<tr data-row data-copy="{{ e.name }}"><td class="ico" aria-hidden="true">{% if e.kind == "tree" %}<svg viewBox="0 0 16 16" width="14" height="14"><path d="M1.5 3h5l1.5 2h6.5v8h-13z" fill="currentColor"/></svg>{% else %}<svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 1.5h6l3 3v10h-9z" fill="none" stroke="currentColor"/></svg>{% endif %}</td><td>{% if e.kind == "tree" %}<a href="/r/{{ r.hex }}/tree/{{ rev }}/{{ self.join(e.name.as_str()) }}">{{ e.name }}/</a>{% else if e.kind == "blob" %}<a href="/r/{{ r.hex }}/blob/{{ rev }}/{{ self.join(e.name.as_str()) }}">{{ e.name }}</a>{% else %}{{ e.name }} <span class="dim">submodule <code>{{ self.short(e.oid.as_str()) }}</code></span>{% endif %}</td><td class="num dim">{% if let Some(s) = e.size %}{{ s }} B{% endif %}</td></tr>
{% endfor %}
</tbody>
</table>
