{% if l.sync.href.is_empty() %}<span class="sync {{ l.sync.state }}" id="sync" role="status" title="{{ l.sync.title }}"{% if !l.live_src.is_empty() %} data-live="sync" data-src="{{ l.live_src }}"{% else if !l.events.is_empty() %} data-live="sync"{% endif %}><i class="dot {{ l.sync.state }}" aria-hidden="true"></i><span class="txt">{{ l.sync.text }}</span></span>{% else %}<a class="sync {{ l.sync.state }}" id="sync" href="{{ l.sync.href }}" title="{{ l.sync.title }}"{% if !l.live_src.is_empty() %} data-live="sync" data-src="{{ l.live_src }}"{% else if !l.events.is_empty() %} data-live="sync"{% endif %}><i class="dot {{ l.sync.state }}" aria-hidden="true"></i><span class="txt">{{ l.sync.text }}</span></a>{% endif %}
