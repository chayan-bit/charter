[package]
name = "charter-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# File-persisted MemArkiv backend for driving the binaries from tests (design 8.3).
fake = ["charter-store/fake"]

[dependencies]
charter-crypto = { path = "../charter-crypto" }
charter-core = { path = "../charter-core" }
charter-program = { path = "../charter-program" }
charter-store = { path = "../charter-store" }
charter-zk = { path = "../charter-zk" }
alloy-signer-local = "2.5"
bs58 = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
minicbor = { version = "2", features = ["alloc"] }
# Same version and features as charter-cli, so no new crates: release downloads.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
charter-store = { path = "../charter-store", features = ["fake"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
