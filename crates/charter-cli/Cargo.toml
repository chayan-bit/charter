[package]
name = "charter-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "git-remote-arkiv"
path = "src/bin/git-remote-arkiv.rs"

[[bin]]
name = "chart"
path = "src/bin/chart.rs"

[dependencies]
alloy-signer-local = "2.5"
charter-core = { path = "../charter-core" }
charter-program = { path = "../charter-program" }
charter-private = { path = "../charter-private" }
charter-escrow = { path = "../charter-escrow" }
charter-store = { path = "../charter-store", features = ["fake"] }
charter-sync = { path = "../charter-sync", features = ["fake"] }
charter-timelock = { path = "../charter-timelock" }
charter-ui = { path = "../charter-ui" }
charter-zk = { path = "../charter-zk" }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
# Same version and features as charter-store, so no new crates: release downloads.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
charter-crypto = { path = "../charter-crypto" }
arkiv-git-zk-core = { path = "../arkiv-git-zk-core" }
tempfile = "3"
