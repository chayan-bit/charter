[workspace]
resolver = "3"
members = [
  "crates/charter-crypto",
  "crates/charter-timelock",
  "crates/charter-core",
  "crates/charter-store",
  "crates/charter-sync",
  "crates/charter-escrow",
  "crates/charter-cli",
  "crates/charter-mcp",
  "crates/charter-ui",
  "crates/charter-program",
  "crates/charter-private",
  "crates/arkiv-git-zk-core",
  "crates/charter-zk",
]
exclude = ["zk"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chayan-bit/charter"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
