# Advisories we accept, each with its reason and its exit condition.
[advisories]
ignore = [
  # crypto-bigint 0.5.5 timing variability (patched in >=0.7.6).
  # Reached only through elliptic-curve 0.13 -> k256 / alloy-signer, i.e. secp256k1 EVM keys
  # (Arkiv tx signing and EVM address derivation). The composite ML-DSA-65 + Ed25519 signatures
  # that authenticate repo data do not use it. Exploiting it needs a co-located timing attacker,
  # and the EVM keys only control Arkiv entity ownership, which clients never trust for content.
  # shortcut: remove this entry as soon as alloy releases on elliptic-curve 0.14 / k256 0.14.
  "RUSTSEC-2026-0387",
  # tracing-subscriber 0.2.25 ANSI escapes in formatted logs (patched in >=0.3.20).
  # Pulled only by ark-relations 0.5.1 (risc0-zkvm -> risc0-groth16 -> ark-groth16), which pins 0.2,
  # with no features enabled: the fmt/ansi formatter that carries the bug is not compiled, and
  # nothing in the workspace installs a tracing subscriber.
  # shortcut: remove this entry once risc0-groth16 moves to an ark-relations on tracing-subscriber 0.3.
  "RUSTSEC-2025-0055",
  # libsqlite3-sys 0.38.2 bundled SQLite CVE-2026-119375 (patched in >=0.39.0).
  # In Cargo.lock only: openmls 0.9 -> optional openmls_sqlite_storage -> refinery/rusqlite 0.40,
  # a feature Charter never enables, so `cargo tree -i rusqlite --all-features` is empty and no
  # Charter binary links SQLite. rusqlite 0.40 and refinery pin 0.38, so it cannot be bumped alone.
  # shortcut: remove this entry once openmls_sqlite_storage moves to rusqlite on libsqlite3-sys >=0.39.
  "RUSTSEC-2026-0459",
]
