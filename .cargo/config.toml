# Windows gives the main thread a 1 MiB stack, and `chart init` overflows it in a debug
# build. Reserve the 8 MiB that Linux and macOS give, so every platform runs the same code.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

# mingw ld keeps a 24 MB COFF symbol table in each exe; msvc puts symbols in a PDB instead.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,8388608", "-C", "strip=symbols"]
