name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Add another binary (for example chart-mcp) by appending it here.
  BINS: "git-remote-arkiv chart chart-mcp"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            # Oldest runner keeps the glibc requirement low.
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out bytes unchanged (no CRLF in embedded assets)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup target add ${{ matrix.target }} && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: |
          args=""
          for b in $BINS; do args="$args --bin $b"; done
          cargo build --locked --release --target ${{ matrix.target }} -p charter-cli -p charter-mcp $args
      - name: Package
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; else v="dev-${GITHUB_SHA::7}"; fi
          name="charter-${v}-${{ matrix.target }}"
          files=""
          for b in $BINS; do cp "target/${{ matrix.target }}/release/${b}${{ matrix.ext }}" .; files="$files ${b}${{ matrix.ext }}"; done
          files="$files LICENSE-APACHE LICENSE-MIT"
          if [ "$RUNNER_OS" = Windows ]; then a="$name.zip"; 7z a -tzip "$a" $files >/dev/null; else a="$name.tar.gz"; tar czf "$a" $files; fi
          if command -v sha256sum >/dev/null; then sha256sum "$a" > "$a.sha256"; else shasum -a 256 "$a" > "$a.sha256"; fi
          cat "$a.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: charter-${{ matrix.target }}
          path: |
            charter-*.tar.gz*
            charter-*.zip*
          if-no-files-found: error

  publish:
    # Only tag pushes create a release; workflow_dispatch stops at the artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes *.tar.gz *.zip SHA256SUMS
