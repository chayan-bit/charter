name: ci
on: [push, pull_request]
jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes in docs
        run: "! grep -rn $'—' --include='*.md' ."
      - name: No tracked secrets files
        run: "! git ls-files | grep -E '(\\.env$|\\.key$|^keys/)'"
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Performance gate (exact fake-chain costs vs bench/baseline.json)
        run: cargo test --workspace --all-features --test bench_gate -- --nocapture
      - run: cargo test --workspace --all-features -- --skip bench_gate
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
